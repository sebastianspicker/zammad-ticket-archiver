name: CI

on:
  workflow_call:
    inputs:
      source_ref:
        description: Validated source commit for the manual prerelease
        type: string
        required: false
        default: ""
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            requirements/dev.lock
            requirements/tools.lock

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install system deps (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libffi-dev \
            libgdk-pixbuf2.0-0 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            fonts-dejavu-core \
            shared-mime-info

      - name: Install
        run: |
          python -m pip install --no-cache-dir --require-hashes --only-binary=:all: -r requirements/tools.lock
          python -m pip install --no-cache-dir --require-hashes --only-binary=:all: -r requirements/dev.lock
          python -m pip install --no-cache-dir --no-deps --no-build-isolation -e .
          make frontend-install

      - name: Verify dependency locks are current
        run: make dependency-locks-fresh

      - name: Release gate
        run: make verify

      - name: Upload dist artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist
          path: dist/

  browser:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            requirements/dev.lock
            requirements/tools.lock

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked application and browser dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes --only-binary=:all: -r requirements/tools.lock
          python -m pip install --no-cache-dir --require-hashes --only-binary=:all: -r requirements/dev.lock
          python -m pip install --no-cache-dir --no-deps --no-build-isolation -e .
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Chromium browser tests
        env:
          PLAYWRIGHT_PYTHON: python
        run: npm run test:browser
