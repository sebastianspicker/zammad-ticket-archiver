name: Security

# Policy:
# - This workflow runs `pip-audit` against the project dependencies.
# - It fails on CRITICAL and HIGH vulnerabilities:
#   - If OSV provides `database_specific.severity`, we require it not to be CRITICAL or HIGH.
#   - Otherwise we use CVSS base score (CRITICAL := >= 9.0, HIGH := >= 7.0).
#   - If severity cannot be determined, we fail closed (treat as CRITICAL).

on:
  workflow_call:
    inputs:
      source_ref:
        description: Validated source commit for the manual prerelease
        type: string
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # weekly (UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: requirements/tools.lock

      - name: Install audit tools
        run: >-
          python -m pip install --no-cache-dir --require-hashes
          --only-binary=:all: -r requirements/tools.lock

      - name: Audit base production dependencies
        run: |
          set +e
          pip-audit --disable-pip --require-hashes \
            -r requirements/base.lock \
            -f json -s osv --desc off --aliases on -o pip-audit-base.json
          audit_status=$?
          set -e
          printf '{"tool":"pip-audit","exit_code":%s}\n' "$audit_status" > pip-audit-base.status.json

      - name: Enforce base audit policy
        run: |
          PIP_AUDIT_INPUT_PATH=pip-audit-base.json \
          PIP_AUDIT_STATUS_PATH=pip-audit-base.status.json \
          python scripts/ci/enforce_pip_audit_policy.py

      - name: Audit signing production dependencies
        run: |
          set +e
          pip-audit --disable-pip --require-hashes \
            -r requirements/signing.lock \
            -f json -s osv --desc off --aliases on -o pip-audit-signing.json
          audit_status=$?
          set -e
          printf '{"tool":"pip-audit","exit_code":%s}\n' "$audit_status" > pip-audit-signing.status.json

      - name: Enforce signing audit policy and package coverage
        run: |
          PIP_AUDIT_INPUT_PATH=pip-audit-signing.json \
          PIP_AUDIT_STATUS_PATH=pip-audit-signing.status.json \
          PIP_AUDIT_REQUIRED_PACKAGES=cryptography,pyhanko,pyhanko-certvalidator,asn1crypto \
          python scripts/ci/enforce_pip_audit_policy.py
