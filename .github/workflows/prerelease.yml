name: Prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing prerelease tag on main to validate and prepare
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.tag.outputs.source_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        env:
          SELECTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]
          git show-ref --verify --quiet "refs/tags/$SELECTED_TAG"
          source_sha="$(git rev-parse "refs/tags/${SELECTED_TAG}^{commit}")"
          git merge-base --is-ancestor "$source_sha" origin/main
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  ci:
    needs: preflight
    with:
      source_ref: ${{ needs.preflight.outputs.source_sha }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    needs: preflight
    with:
      source_ref: ${{ needs.preflight.outputs.source_sha }}
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [preflight, ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Validate tag, project version, and changelog section
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)-(alpha|beta|rc)\.(\d+)", tag)
          if match is None:
              raise SystemExit(f"invalid prerelease tag: {tag}")
          marker = {"alpha": "a", "beta": "b", "rc": "rc"}[match.group(2)]
          normalized = f"{match.group(1)}{marker}{match.group(3)}"
          with Path("pyproject.toml").open("rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]
          if project_version != normalized:
              raise SystemExit(
                  f"tag/version mismatch: {tag} normalizes to {normalized}, "
                  f"project.version is {project_version}"
              )
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## [{tag[1:]}]"
          heading_pattern = re.compile(
              rf"{re.escape(heading)}(?: - \d{{4}}-\d{{2}}-\d{{2}})?"
          )
          lines = changelog.splitlines()
          start = next(
              (index + 1 for index, line in enumerate(lines) if heading_pattern.fullmatch(line)),
              None,
          )
          if start is None:
              raise SystemExit(f"missing exact CHANGELOG section: {heading}")
          end = next((i for i in range(start, len(lines)) if lines[i].startswith("## [")), len(lines))
          if not any(line.strip() for line in lines[start:end]):
              raise SystemExit(f"empty CHANGELOG section: {heading}")
          Path("release-notes.md").write_text(
              "\n".join(lines[start:end]).rstrip() + "\n", encoding="utf-8"
          )
          PY

      - name: Download verified CI distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Generate checksums from verified artifacts
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          cd dist
          sha256sum -- ./*.whl ./*.tar.gz > SHA256SUMS

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          name: ${{ inputs.tag }}
          tag_name: ${{ inputs.tag }}
          draft: true
          prerelease: true
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
